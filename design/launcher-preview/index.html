<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F5F1">
  <title>KRKR-ns · 游戏库</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="viewport">
    <main class="console" aria-label="KRKR-ns 游戏启动器">
      <header class="header">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 56 56" aria-hidden="true"><g stroke="#665879" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M28 23.5c-2.4-2.9-5.4-4.9-9.2-6L9.9 8.6c-.7-.6-1.8-.2-1.9.8L6.8 20.2v22c7.6-2.7 14.4-.5 21.2 3.8 6.8-4.3 13.6-6.5 21.2-3.8v-22L48 9.4c-.1-1-1.2-1.4-1.9-.8l-8.9 8.9c-3.8 1.1-6.8 3.1-9.2 6Z" fill="#D9D2F3"/><path d="M9.6 22c6.5-1.1 12.5.8 18.4 5.1v15.1c-5.9-4.4-12.2-5.6-18.4-3.6Z" fill="#FFFDFA" stroke="none"/><path d="M46.4 22c-6.5-1.1-12.5.8-18.4 5.1v15.1c5.9-4.4 12.2-5.6 18.4-3.6Z" fill="#E9E3F7" stroke="none"/><path d="m10.5 13.1 5.7 5.8-6.4-.6Z" fill="#FFFDFA" stroke="none"/><path d="m45.5 13.1-5.7 5.8 6.4-.6Z" fill="#FFFDFA" stroke="none"/><path d="M6.8 20.2c7.6-1.8 15.2.4 21.2 5.2 6-4.8 13.6-7 21.2-5.2M28 25.4V46" fill="none"/><path d="m13.2 28.3 8.1 2.3m-8.1 4.4 5.2 1.4" stroke="#B7A8CF" stroke-width="1.6"/><path d="M35.1 27.8c0-.6.6-.9 1.1-.6l6.1 3.8c.5.3.5 1 0 1.3l-6.1 3.3c-.5.3-1.1-.1-1.1-.6Z" fill="#9B86BC" stroke="none"/></g></svg>
          <div><span class="brand-name">KRKR<span>ns</span></span><span class="brand-sub">游戏库</span></div>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="refresh-button" aria-label="刷新游戏库" title="刷新游戏库（Y）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 8a8 8 0 1 0 .2 7M19.4 8V3.7M19.4 8h-4.3"/></svg></button>
          <button class="icon-button" id="view-button" aria-label="审核视图" aria-haspopup="menu" aria-expanded="false" title="审核视图"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
        </div>
      </header>

      <section class="library" aria-label="游戏库">
        <div class="section-label"><span>你的游戏</span><span id="library-count">14 部作品</span></div>
        <div class="game-list" id="game-list" role="listbox" aria-label="选择游戏"><div class="selection-pill" id="selection-pill" aria-hidden="true"></div><div class="rows" id="game-rows"></div></div>
        <div class="pagination" id="pagination"><span class="page-label" id="page-label">01 <span>/ 03</span></span><div class="page-controls"><button id="prev-page" class="page-button" aria-label="上一页"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg></button><button id="next-page" class="page-button" aria-label="下一页"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg></button></div></div>
      </section>

      <section class="detail" id="detail" aria-label="所选游戏">
        <div class="hero" id="hero"><div class="hero-caption"><span class="caption-dot"></span><span>已选择</span></div><div class="hero-art" id="hero-art"></div><span class="hero-number" id="hero-number">01</span></div>
        <div class="game-heading"><div class="heading-eyebrow">本地游戏</div><h1 id="game-title">风在信纸上停留</h1></div>
        <button class="detail-action-button images-button" id="images-button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 5"/></svg>图片</button>
        <button class="detail-action-button detail-options-button" id="detail-options-button"><span class="controller-key">X</span>选项</button>
        <button class="launch-button" id="launch-button"><span class="controller-key">A</span><span>开始游戏</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
      </section>

      <section class="empty-state" id="empty-state" hidden aria-label="空游戏库">
        <div class="empty-art" id="empty-art"></div><h1>暂无游戏</h1><p>将游戏文件夹放入 SD:/switch/KRKR-ns/Game/</p><button class="empty-refresh" id="empty-refresh"><span class="controller-key">Y</span>刷新游戏库<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 8a8 8 0 1 0 .2 7M19.4 8V4M19.4 8h-4"/></svg></button>
      </section>

      <footer class="footer"><div class="footer-hints"><span class="hint"><span class="dpad">✚</span>选择</span><span class="switch-buttons" aria-label="Switch按键布局：上X，下B，左Y，右A"><span class="key switch-x">X</span><span class="key switch-y">Y</span><span class="key switch-a">A</span><span class="key switch-b">B</span></span><button class="hint" id="footer-launch"><span class="key">A</span>开始</button><button class="hint" id="footer-back"><span class="key">B</span>返回</button><button class="hint" id="options-button"><span class="key">X</span>启动选项</button><button class="hint" id="footer-refresh"><span class="key">Y</span>刷新</button><button class="hint" id="footer-images"><span class="key">−</span>图片</button></div></footer>

      <div class="view-menu" id="view-menu" role="menu" hidden><span class="menu-caption">审核视图</span><button role="menuitem" id="sample-view">示例游戏库 <span>14</span></button><button role="menuitem" id="empty-view">空游戏库 <span>0</span></button></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="modal-backdrop" id="options-backdrop" hidden>
        <section class="options-modal" role="dialog" aria-modal="true" aria-labelledby="options-title">
          <div class="modal-heading"><span class="modal-flower">✳</span><div><span class="modal-eyebrow">启动选项</span><h2 id="options-title">启动文件</h2></div><button class="modal-close" id="close-options" aria-label="关闭启动选项">×</button></div>
          <p class="options-story" id="options-story">风在信纸上停留</p>
          <p class="file-note">通常无需更换，使用当前启动文件即可。</p>
          <div class="file-options" id="file-options" role="listbox" aria-label="启动文件">
            <button class="file-choice" role="option" aria-selected="true" data-file="data.xp3"><span class="file-icon">↗</span><span>data.xp3</span><small>推荐</small><span class="file-radio"></span></button>
            <button class="file-choice" role="option" aria-selected="false" data-file="play.xp3"><span class="file-icon">↗</span><span>play.xp3</span><span class="file-radio"></span></button>
            <button class="file-choice" role="option" aria-selected="false" data-file="startup.tjs"><span class="file-icon">↗</span><span>startup.tjs</span><span class="file-radio"></span></button>
            <button class="file-choice" role="option" aria-selected="false" data-file="start.tjs"><span class="file-icon">↗</span><span>start.tjs</span><span class="file-radio"></span></button>
          </div>
          <div class="modal-footer"><span><span class="key">B</span> 返回<span class="key">A</span> 选择</span><button id="done-options">保持当前</button></div>
        </section>
      </div>
      <div class="image-backdrop" id="images-backdrop" hidden>
        <section class="images-dialog" id="images-dialog" role="dialog" aria-modal="true" aria-labelledby="images-title">
          <header class="images-header"><div><h2 id="images-title">图片设置</h2><p id="images-game-title"></p></div><button class="image-close" id="close-images" aria-label="关闭图片设置">×</button></header>
          <div class="images-toolbar"><div class="image-role-tabs" role="tablist" aria-label="图片用途"><button id="image-tab-preview" role="tab" aria-selected="true" aria-controls="image-content" data-role="preview">右侧大图</button><button id="image-tab-avatar" role="tab" aria-selected="false" aria-controls="image-content" data-role="avatar">列表头像</button></div><div class="image-source-actions"><button id="image-scan"><span class="key">Y</span>模拟扫描</button><button id="image-upload"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m-4 4 4-4 4 4M3 12v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg>从本地选择</button></div></div>
          <div class="image-status-line"><span id="image-status" role="status" aria-live="polite">示例候选图片；模拟扫描不访问游戏内容。</span><span id="image-count">6 张图片</span></div>
          <div class="image-progress-track" id="image-progress-track" hidden><div id="image-progress" role="progressbar" aria-label="模拟扫描进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div>
          <div class="image-content" id="image-content" role="tabpanel" aria-labelledby="image-tab-preview"><div class="image-candidate-grid" id="image-candidates" role="listbox" aria-label="候选图片"></div><aside class="image-inspector"><span class="image-inspector-label" id="image-role-label">右侧大图</span><div class="image-selection-preview" id="image-selection-preview"></div><strong id="image-selection-name">自动推荐</strong><p id="image-role-description">应用后显示在右侧大图。</p><span class="image-crop-note">居中裁剪，保持比例。</span></aside></div>
          <footer class="images-footer"><button class="image-reset" id="image-reset">恢复默认</button><span class="image-panel-hints"><span class="key">B</span>返回<span class="key">A</span>应用<span class="shoulder-key">L/R</span>切换用途</span><button class="image-apply" id="image-apply"><span class="controller-key">A</span>应用</button></footer>
          <input id="image-file" type="file" accept="image/png,image/jpeg" hidden>
        </section>
      </div>
      <div class="launch-state" id="launch-state" hidden><div class="launch-orbit"><span>✦</span><i></i></div><span class="launch-eyebrow">正在启动</span><h1 id="launch-title"></h1><p>交互预览，不会实际启动游戏。</p><button id="return-library"><span class="key">B</span>返回游戏库</button></div>
    </main>
  </div>
  <script src="mock-art.js"></script>
  <script src="app.js"></script>
</body>
</html>
